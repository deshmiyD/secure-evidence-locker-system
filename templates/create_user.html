<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Create User - Digital Forensics System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(30, 41, 59, 0.90)),
                        url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?ixlib=rb-4.0.3&auto=format&fit=crop&w=2070&q=80') center/cover no-repeat fixed;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .main-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            padding: 2.5rem;
            margin-top: 3rem;
            margin-bottom: 3rem;
            max-width: 600px;
            backdrop-filter: blur(10px);
        }
        h1 {
            color: #1e293b;
            font-weight: 600;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }
        .card {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        .form-control, .form-select {
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 0.75rem;
            transition: border-color 0.2s ease;
        }
        .form-control:focus, .form-select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .form-label {
            color: #475569;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }
        .btn {
            border-radius: 6px;
            font-weight: 500;
            padding: 0.625rem 1.5rem;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background-color: #3b82f6;
            border-color: #3b82f6;
        }
        .btn-primary:hover {
            background-color: #2563eb;
            border-color: #2563eb;
            transform: translateY(-1px);
        }
        .btn-outline-secondary {
            border-color: #94a3b8;
            color: #64748b;
        }
        .btn-outline-secondary:hover {
            background-color: #f1f5f9;
            border-color: #94a3b8;
        }
        .alert {
            border-radius: 6px;
            border: none;
        }
    </style>
</head>
<body>
<div class="container d-flex justify-content-center">
    <div class="main-container">
        <h1>Create New User</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="post" class="card p-4">
            <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <input class="form-control" id="username" name="username" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input class="form-control" id="password" name="password" type="password" required>
            </div>
            <div class="mb-4">
                <label class="form-label" for="role">Role</label>
                <select class="form-select" id="role" name="role" required>
                    <option value="investigator" selected>Investigator</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-primary" type="submit">Create User</button>
                <a class="btn btn-outline-secondary" href="{{ url_for('admin_dashboard') }}">Cancel</a>
            </div>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
